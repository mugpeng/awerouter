[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awerouter"
dynamic = ["version"]
description = "Smart LLM router: fast cheap tasks to flash, hard decisions to pro."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MPL-2.0" }
authors = [
  { name = "Peng" }
]
keywords = ["ai", "llm", "router", "claude", "proxy", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities"
]
dependencies = [
    "click>=8.1",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "awecompress @ git+https://github.com/wehuman01/awecompress.git@7a4dc22"]
# In-process frozen-summary history compression (routing.json "awecompress"
# profile flag); also as its own extra: pip install awerouter[compress].
compress = ["awecompress @ git+https://github.com/wehuman01/awecompress.git@7a4dc22"]

[project.scripts]
awerouter = "awerouter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "awerouter.__version__" }

[tool.setuptools.package-data]
awerouter = ["py.typed", "resources/templates/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
